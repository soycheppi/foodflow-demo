<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FoodFlow Gourmet — Artisan Food & Direct WhatsApp Checkout</title>

    <meta
      name="description"
      content="Browse our artisan food menu and order directly via WhatsApp in seconds. Fast, seamless, commission-free ordering."
    />
    <meta
      name="keywords"
      content="food ordering, artisan burgers, craft kitchen, whatsapp checkout, react 19 template"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#dc2626" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FoodFlow Gourmet — Artisan Food Ordering" />
    <meta
      property="og:description"
      content="Artisan food delivered straight to your door. Order in seconds via WhatsApp."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="FoodFlow" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FoodFlow Gourmet — Artisan Food Ordering" />
    <meta
      name="twitter:description"
      content="Artisan food delivered straight to your door. Order in seconds via WhatsApp."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Google Fonts & External Assets Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- LCP Hero Image Preload -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="https://images.unsplash.com/photo-1550547660-d9450f859349?fm=webp&w=480&q=60"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
